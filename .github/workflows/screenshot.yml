name: Website Screenshot

on:
  # اجرای دستی از تب Actions
  workflow_dispatch:
    inputs:
      url:
        description: "URL مورد نظر برای اسکرین‌شات"
        required: true
        default: "https://chatgpt.com"
      full_page:
        description: "اسکرین‌شات کل صفحه؟"
        type: boolean
        default: true

  # اجرای زمان‌بندی‌شده (هر روز ساعت ۶ صبح UTC = ۹:۳۰ تهران)
  schedule:
    - cron: "0 6 * * *"

  # اجرا با هر push روی main (اختیاری)
  push:
    branches: [main]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Take screenshot
        run: |
          python screenshot.py "${{ github.event.inputs.url || 'https://chatgpt.com' }}" screenshot.png

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshot-${{ github.run_number }}
          path: screenshot.png
          retention-days: 30
          if-no-files-found: error
