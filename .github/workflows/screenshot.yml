name: Generate Nano Address

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GG_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python generate.py

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-address-${{ github.run_number }}
          path: nano_addresses/
          retention-days: 30
          if-no-files-found: error

      - name: Commit to repo
        env:
          GG_TOKEN: ${{ secrets.GG_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GG_TOKEN}@github.com/${{ github.repository }}.git
          git add nano_addresses/
          git commit -m "chore: add nano address [skip ci]" || echo "no changes to commit"
          git push
