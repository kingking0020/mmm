name: Website Screenshot

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL مورد نظر برای اسکرین‌شات"
        required: true
        default: "https://example.com"
      full_page:
        description: "کل صفحه اسکرین‌شات بشه؟"
        type: boolean
        default: true
      wait_seconds:
        description: "ثانیه صبر بعد از لود صفحه"
        type: string
        default: "5"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install patchright==1.49.0
          python -m patchright install chromium

      - name: Take screenshot
        run: |
          python screenshot.py \
            "${{ inputs.url }}" \
            screenshot.png \
            "${{ inputs.full_page }}" \
            "${{ inputs.wait_seconds }}"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ github.run_number }}
          path: screenshot.png
          retention-days: 30
          if-no-files-found: error
